name: Tests
on:
  pull_request:
  push:
    branches: [master, 'release/**']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Test with a fresh Maven repository
        run: mvn -B -ntp -Dmaven.repo.local="$RUNNER_TEMP/m2" clean verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: target/surefire-reports
